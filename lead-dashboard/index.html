<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Hunter — Turyap Queen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d2247;--navy-mid:#163366;--navy-lt:#1e4a8a;
  --gold:#b8932a;--gold-lt:#d4a940;
  --bg:#eef2f7;--bg-mid:#dce4ef;--panel:#f7f9fc;--white:#ffffff;
  --dimtxt:#7a90a8;--green:#16a34a;--amber:#d97706;--blue:#2563eb;--red:#dc2626;
  --shadow:0 2px 16px rgba(13,34,71,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--navy);min-height:100%;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(30,74,138,0.07) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 90% 100%,rgba(184,147,42,0.06) 0%,transparent 55%);pointer-events:none;z-index:0;}

#loginScreen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:1000;}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 30% 40%,rgba(184,147,42,0.12) 0%,transparent 70%);}
.login-card{background:rgba(255,255,255,0.04);border:1px solid rgba(184,147,42,0.25);border-radius:20px;padding:40px 36px;width:320px;text-align:center;position:relative;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.login-logo{width:76px;height:76px;margin:0 auto 16px;overflow:hidden;border-radius:14px;box-shadow:0 0 0 2px rgba(184,147,42,0.4);}
.login-logo svg{width:76px;height:76px;}
.login-card h1{font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:4px;}
.login-card p{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:28px;}
.login-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:13px 18px;font-size:14px;font-family:'Nunito',sans-serif;color:#fff;outline:none;text-align:center;letter-spacing:0.08em;margin-bottom:14px;transition:border-color 0.2s;}
.login-input::placeholder{color:rgba(255,255,255,0.3);letter-spacing:0;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:13px;background:var(--gold);border:none;border-radius:12px;color:var(--navy);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.login-btn:hover{background:var(--gold-lt);}
.login-err{font-size:12px;color:#f87171;margin-top:10px;display:none;}

#appShell{display:none;min-height:100vh;position:relative;z-index:1;padding-bottom:90px;}

.lh-header{background:var(--navy);border-bottom:2px solid var(--gold);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(13,34,71,0.2);}
.lh-brand{display:flex;align-items:center;gap:12px;}
.lh-brand-logo{width:46px;height:46px;background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1.5px var(--gold),0 2px 10px rgba(0,0,0,0.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.lh-brand-logo svg{width:40px;height:40px;}
.lh-brand-info h1{font-family:'Playfair Display',serif;font-size:16px;color:#fff;}
.lh-brand-info p{font-size:10px;color:rgba(255,255,255,0.45);margin-top:1px;}
.lh-header-right{display:flex;align-items:center;gap:10px;}

.bell-btn{position:relative;width:36px;height:36px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
.bell-btn:hover{background:rgba(255,255,255,0.16);border-color:var(--gold);}
.bell-btn svg{width:16px;height:16px;stroke:rgba(255,255,255,0.7);fill:none;stroke-width:2;}
.bell-btn.has-new{border-color:var(--gold);background:rgba(184,147,42,0.18);}
.bell-btn.has-new svg{stroke:var(--gold);animation:bellRing 0.6s ease 0s 3;}
@keyframes bellRing{0%,100%{transform:rotate(0);}20%{transform:rotate(-15deg);}40%{transform:rotate(15deg);}60%{transform:rotate(-10deg);}80%{transform:rotate(10deg);}}
.bell-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:10px;font-weight:800;font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--navy);display:none;}
.bell-badge.show{display:flex;}

.refresh-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:7px 14px;color:rgba(255,255,255,0.7);font-family:'Nunito',sans-serif;font-size:11px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
.refresh-btn:hover{background:rgba(255,255,255,0.14);color:#fff;}
.refresh-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.refresh-btn.spinning svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.last-refresh{font-size:10px;color:rgba(255,255,255,0.35);}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:7px 12px;color:rgba(255,255,255,0.45);font-size:11px;font-family:'Nunito',sans-serif;cursor:pointer;transition:all 0.2s;}
.logout-btn:hover{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.7);}

.new-lead-alert{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--navy);border:2px solid var(--gold);border-radius:16px;padding:14px 24px;min-width:280px;text-align:center;box-shadow:0 8px 32px rgba(13,34,71,0.35);z-index:9990;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;backdrop-filter:blur(8px);}
.new-lead-alert.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 24px 0;}
.stat-card{background:var(--white);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.stat-card.s-total::before{background:var(--navy-lt);}
.stat-card.s-today::before{background:var(--gold);}
.stat-card.s-new::before{background:var(--green);}
.stat-card.s-contact::before{background:var(--blue);}
.stat-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:var(--navy);line-height:1;}
.stat-label{font-size:10px;color:var(--dimtxt);text-transform:uppercase;letter-spacing:0.1em;margin-top:5px;}

.analytics-section{padding:16px 24px 0;display:flex;flex-direction:column;gap:12px;}
.analytics-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.analytics-card{background:var(--white);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
.analytics-title{font-size:10px;color:var(--dimtxt);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;font-weight:700;}
.topic-bar-item{margin-bottom:7px;}
.topic-bar-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--navy);margin-bottom:3px;}
.topic-bar-track{background:var(--bg-mid);border-radius:4px;height:6px;overflow:hidden;}
.topic-bar-fill{height:100%;border-radius:4px;transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);}
.tbf-satis{background:#2563eb;}.tbf-kiralama{background:#16a34a;}.tbf-yatirim{background:var(--gold);}.tbf-degerleme{background:#7c3aed;}.tbf-genel{background:#64748b;}
.lang-dist-grid{display:flex;flex-wrap:wrap;gap:7px;}
.lang-dist-item{display:flex;align-items:center;gap:5px;background:var(--bg);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--navy);}
.lang-dist-item .ldi-count{background:var(--navy);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:2px;}
.trend-bars{display:flex;align-items:flex-end;gap:6px;height:50px;padding-top:4px;}
.trend-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.trend-bar-fill{width:100%;background:var(--navy-lt);border-radius:3px 3px 0 0;transition:height 0.4s ease;min-height:2px;}
.trend-bar-fill.today{background:var(--gold);}
.trend-bar-day{font-size:8px;color:var(--dimtxt);text-align:center;}
.trend-bar-num{font-size:9px;font-weight:700;color:var(--navy);}

.filter-row{display:flex;align-items:center;gap:10px;padding:16px 24px 0;flex-wrap:wrap;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.pill{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;border:1.5px solid var(--bg-mid);background:var(--white);color:var(--dimtxt);}
.pill:hover{border-color:var(--navy-lt);color:var(--navy-lt);}
.pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.pill .count{display:inline-block;background:rgba(255,255,255,0.2);border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px;}
.pill:not(.active) .count{background:var(--bg-mid);color:var(--dimtxt);}
.search-wrap{position:relative;}
.search-input{background:var(--white);border:1.5px solid var(--bg-mid);border-radius:20px;padding:8px 16px 8px 36px;font-size:12px;font-family:'Nunito',sans-serif;color:var(--navy);outline:none;width:200px;transition:border-color 0.2s;}
.search-input:focus{border-color:var(--navy-lt);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dimtxt);fill:none;stroke-width:2;}

.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:16px 24px 32px;}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dimtxt);}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4;}
.empty-state p{font-size:13px;}

.lead-card{background:var(--white);border-radius:16px;padding:0;box-shadow:var(--shadow);overflow:hidden;transition:all 0.2s;animation:cardIn 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(6px) scale(0.98);}to{opacity:1;transform:none;}}
.lead-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(13,34,71,0.12);}
.lead-card.is-new{box-shadow:0 0 0 2px var(--gold),var(--shadow);}
.card-top{padding:16px 16px 12px;border-bottom:1px solid var(--bg);}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.card-header-left{display:flex;flex-direction:column;flex:1;}
.card-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--navy);line-height:1.2;}
.card-time{font-size:10px;color:var(--dimtxt);margin-top:2px;}
.card-header-right{display:flex;align-items:center;gap:4px;}
.card-lang{font-size:16px;line-height:1;}
.delete-btn{width:24px;height:24px;background:transparent;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;color:var(--red);font-size:14px;padding:0;}
.delete-btn:hover{background:rgba(220,38,38,0.1);}
.card-phone{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.card-phone-num{font-size:13px;font-weight:600;color:var(--navy-lt);}
.copy-btn{width:22px;height:22px;background:var(--bg);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.copy-btn:hover{background:var(--gold);}
.copy-btn svg{width:11px;height:11px;stroke:var(--dimtxt);fill:none;stroke-width:2;}
.copy-btn:hover svg{stroke:#fff;}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;}
.topic-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;}
.topic-badge.satis{background:#eff6ff;color:#2563eb;}.topic-badge.kiralama{background:#f0fdf4;color:#16a34a;}.topic-badge.yatirim{background:#fefce8;color:#b8932a;}.topic-badge.degerleme{background:#faf5ff;color:#7c3aed;}.topic-badge.genel{background:#f1f5f9;color:#64748b;}
.status-badge{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;}
.status-badge.yeni{background:#dbeafe;color:#2563eb;}.status-badge.aranacak{background:#fef3c7;color:#d97706;}.status-badge.takip{background:#d1fae5;color:#065f46;}.status-badge.kapali{background:#f1f5f9;color:#64748b;}
.card-context{padding:0 16px;max-height:0;overflow:hidden;transition:max-height 0.3s ease,padding 0.3s ease;}
.card-context.open{max-height:300px;padding:10px 16px 12px;overflow-y:auto;}
.context-title{font-size:10px;color:var(--dimtxt);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;font-weight:700;}
.context-msg{display:flex;gap:6px;margin-bottom:6px;}
.ctx-role{font-size:10px;font-weight:700;min-width:50px;padding-top:1px;}
.ctx-role.user{color:var(--navy-lt);}.ctx-role.bot{color:var(--gold);}
.ctx-text{font-size:11px;color:#4a6080;line-height:1.5;}
.card-actions{padding:12px 16px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.action-btns{display:flex;gap:6px;}
.act-btn{padding:7px 14px;border-radius:12px;font-size:12px;font-weight:600;font-family:'Nunito',sans-serif;text-decoration:none;border:none;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.act-btn.call{background:#dcfce7;color:#16a34a;}.act-btn.call:hover{background:#16a34a;color:#fff;}
.act-btn.wa{background:#dcfce7;color:#16a34a;}.act-btn.wa:hover{background:#25D366;color:#fff;}
.act-btn.expand{background:var(--white);color:var(--dimtxt);border:1px solid var(--bg-mid);padding:7px 10px;}.act-btn.expand:hover{border-color:var(--navy-lt);color:var(--navy-lt);}
.status-select{background:var(--white);border:1.5px solid var(--bg-mid);border-radius:10px;padding:6px 10px;font-size:11px;font-family:'Nunito',sans-serif;font-weight:600;color:var(--navy);cursor:pointer;outline:none;transition:border-color 0.2s;}
.status-select:focus{border-color:var(--gold);}

.float-q{position:fixed;bottom:28px;right:24px;width:54px;height:54px;background:var(--navy);border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(13,34,71,0.35);z-index:200;transition:all 0.25s;animation:floatBounce 3s ease-in-out infinite;text-decoration:none;}
.float-q:hover{transform:scale(1.1);box-shadow:0 8px 28px rgba(13,34,71,0.45);animation:none;}
.float-q svg{width:34px;height:34px;}
.float-q-tip{position:absolute;right:64px;background:var(--navy);color:#fff;font-size:11px;font-family:'Nunito',sans-serif;font-weight:600;padding:5px 11px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s;border:1px solid rgba(255,255,255,0.1);}
.float-q:hover .float-q-tip{opacity:1;}
@keyframes floatBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.loading-overlay{position:fixed;inset:0;background:rgba(238,242,247,0.85);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(4px);}
.loading-dots{display:flex;gap:6px;}
.loading-dots span{width:10px;height:10px;background:var(--navy);border-radius:50%;animation:bonce 1.2s infinite;}
.loading-dots span:nth-child(2){animation-delay:0.2s;}
.loading-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bonce{0%,80%,100%{transform:translateY(0);opacity:0.4;}40%{transform:translateY(-8px);opacity:1;}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;font-family:'Nunito',sans-serif;opacity:0;transition:all 0.3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:#16a34a;color:#fff;}
.toast.error{background:#dc2626;color:#fff;}

.date-filter-row{display:flex;align-items:center;gap:10px;padding:10px 24px 0;flex-wrap:wrap;}
.date-filter-row label{font-size:11px;color:var(--dimtxt);font-weight:700;}
.date-input{background:var(--white);border:1.5px solid var(--bg-mid);border-radius:20px;padding:7px 14px;font-size:12px;font-family:'Nunito',sans-serif;color:var(--navy);outline:none;transition:border-color 0.2s;cursor:pointer;}
.date-input:focus{border-color:var(--navy-lt);}
.export-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--gold);background:var(--gold);color:var(--navy);font-family:'Nunito',sans-serif;transition:all 0.2s;display:flex;align-items:center;gap:5px;margin-left:auto;}
.export-btn:hover:not(:disabled){background:#c9a030;border-color:#c9a030;}
.export-btn:disabled{opacity:0.5;cursor:not-allowed;}
.export-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
@media(max-width:640px){
  .date-filter-row{padding:8px 16px 0;}
  .export-btn span{display:none;}
  .stats-bar{grid-template-columns:1fr 1fr;padding:16px 16px 0;}
  .lead-grid{grid-template-columns:1fr;padding:16px;}
  .analytics-row{grid-template-columns:1fr;}
  .filter-row{padding:12px 16px 0;}
  .search-input{width:100%;}
}

#newLeadAlert{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--navy);border:2px solid var(--gold);border-radius:16px;padding:14px 24px;min-width:280px;text-align:center;box-shadow:0 8px 32px rgba(13,34,71,0.35);z-index:9990;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;backdrop-filter:blur(8px);}
#newLeadAlert.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 100 100"><path d="M50 10 L85 35 L85 85 Q85 95 75 95 L25 95 Q15 95 15 85 L15 35 Z" fill="#0d2247"/><circle cx="50" cy="50" r="18" fill="#b8932a"/></svg>
    </div>
    <h1>Lead Hunter</h1>
    <p>Turyap Queen — Ask·Q</p>
    <input class="login-input" id="secretInput" type="password" placeholder="Gizli Anahtar">
    <button class="login-btn" id="loginBtn">Giriş</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="appShell">
  <header class="lh-header">
    <div class="lh-brand">
      <div class="lh-brand-logo">
        <svg viewBox="0 0 100 100"><path d="M50 10 L85 35 L85 85 Q85 95 75 95 L25 95 Q15 95 15 85 L15 35 Z" fill="#0d2247"/><circle cx="50" cy="50" r="18" fill="#b8932a"/></svg>
      </div>
      <div class="lh-brand-info">
        <h1>Lead Hunter</h1>
        <p>Turyap Queen — Ask·Q</p>
      </div>
    </div>
    <div class="lh-header-right">
      <span class="last-refresh" id="lastRefreshTxt"></span>
      <div class="bell-btn" id="bellBtn" onclick="clearBell()" title="Bildirimler">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="bell-badge" id="bellBadge">0</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadLeads(true)">
        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Yenile
      </button>
      <button class="logout-btn" onclick="doLogout()">Çıkış</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card s-total"><div class="stat-num" id="sTot">—</div><div class="stat-label">Toplam Lead</div></div>
    <div class="stat-card s-today"><div class="stat-num" id="sToday">—</div><div class="stat-label">Bugün</div></div>
    <div class="stat-card s-new"><div class="stat-num" id="sNew">—</div><div class="stat-label">Yeni / Bekleyen</div></div>
    <div class="stat-card s-contact"><div class="stat-num" id="sDone">—</div><div class="stat-label">Tamamlanan</div></div>
  </div>

  <div class="analytics-section">
    <div class="analytics-row">
      <div class="analytics-card">
        <div class="analytics-title">Konu Dağılımı</div>
        <div id="topicBars"></div>
      </div>
      <div class="analytics-card">
        <div class="analytics-title">Dil Dağılımı</div>
        <div class="lang-dist-grid" id="langDist"></div>
        <div class="analytics-title" style="margin-top:14px;">Son 7 Gün</div>
        <div class="trend-bars" id="trendChart"></div>
      </div>
    </div>
  </div>

  <div class="filter-row">
    <div class="filter-pills">
      <div class="pill active" data-filter="all" onclick="setFilter('all',this)">Tümü <span class="count" id="cAll">0</span></div>
      <div class="pill" data-filter="yeni" onclick="setFilter('yeni',this)">🔵 Yeni <span class="count" id="cYeni">0</span></div>
      <div class="pill" data-filter="aranacak" onclick="setFilter('aranacak',this)">🟡 Aranacak <span class="count" id="cAranacak">0</span></div>
      <div class="pill" data-filter="takip" onclick="setFilter('takip',this)">🟢 Takipte <span class="count" id="cTakip">0</span></div>
      <div class="pill" data-filter="kapali" onclick="setFilter('kapali',this)">⚪ Kapandı <span class="count" id="cKapali">0</span></div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" placeholder="İsim veya telefon ara…" oninput="renderLeads()">
    </div>
  </div>

  <div class="date-filter-row">
    <label>Başlangıç:</label>
    <input class="date-input" type="date" id="dateFrom" onchange="renderLeads()">
    <label>Bitiş:</label>
    <input class="date-input" type="date" id="dateTo" onchange="renderLeads()">
    <button class="export-btn" id="csvBtn" onclick="exportCSV()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>CSV İndir</span>
    </button>
    <button class="export-btn" id="excelBtn" onclick="exportExcel()" style="background:var(--navy-lt);border-color:var(--navy-lt);color:#fff;margin-left:0;">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Excel İndir</span>
    </button>
  </div>

  <div class="lead-grid" id="leadGrid"></div>
</div>

<div class="loading-overlay" id="loading" style="display:none;"><div class="loading-dots"><span></span><span></span><span></span></div></div>
<div class="toast" id="toast"></div>

<div id="newLeadAlert">
  <div style="font-size:18px;margin-bottom:6px;">🎉</div>
  <div style="font-family:'Playfair Display',serif;font-size:15px;color:#fff;margin-bottom:3px;" id="nlaTitle">Yeni Lead Geldi!</div>
  <div style="font-size:11px;color:rgba(255,255,255,0.6);" id="nlaSub">Yeni bir potansiyel müşteri bilgilerini bıraktı.</div>
  <button class="nla-close" onclick="dismissAlert()" style="background:var(--gold);border:none;border-radius:8px;padding:6px 16px;color:var(--navy);font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;cursor:pointer;">Tamam</button>
</div>

<a class="float-q" href="index.html">
  <div class="float-q-tip">Chatbot'a git</div>
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
</a>

<script>
const WORKER_URL='https://groq-proxy.miyicioglu.workers.dev';
let secret='',allLeads=[],currentFilter='all',refreshInterval=null;
let prevLeadCount=0,unreadCount=0,exportInProgress=false;

const topicMeta={
  satis:{label:'Satış',cls:'satis',barCls:'tbf-satis'},
  kiralama:{label:'Kiralama',cls:'kiralama',barCls:'tbf-kiralama'},
  yatirim:{label:'Yatırım',cls:'yatirim',barCls:'tbf-yatirim'},
  degerleme:{label:'Değerleme',cls:'degerleme',barCls:'tbf-degerleme'},
  genel:{label:'Genel',cls:'genel',barCls:'tbf-genel'}
};
const statusMeta={
  yeni:{label:'Yeni',cls:'yeni'},
  aranacak:{label:'Aranacak',cls:'aranacak'},
  takip:{label:'Takipte',cls:'takip'},
  kapali:{label:'Kapandı',cls:'kapali'}
};
const langFlags={tr:'🇹🇷',en:'🇺🇸',ar:'🇸🇦',ru:'🇷🇺',fr:'🇫🇷',de:'🇩🇪',es:'🇪🇸',pt:'🇵🇹',ja:'🇯🇵',zh:'🇨🇳'};
const DAY_NAMES=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];

function doLogin(){
  const inp=document.getElementById('secretInput');
  secret=inp.value.trim();
  if(!secret){showToast('Gizli Anahtar giriniz','error');return;}
  document.getElementById('loading').style.display='flex';
  loadLeads(false);
}

function doLogout(){
  secret='';
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('secretInput').value='';
}

async function loadLeads(manual){
  try{
    document.getElementById('refreshBtn').classList.toggle('spinning',manual);
    const url=`${WORKER_URL}/leads`;
    const res=await fetch(url,{headers:{'x-leads-secret':secret}});
    const data=await res.json();
    console.log('📊 API Response:', {type:typeof data, isArray:Array.isArray(data), count:Array.isArray(data)?data.length:0, sample:Array.isArray(data)&&data.length>0?data[0]:null});
    if(Array.isArray(data)){
      allLeads=data;
      document.getElementById('appShell').style.display='block';
      document.getElementById('loginScreen').style.display='none';
      if(prevLeadCount>0&&allLeads.length>prevLeadCount){
        const yeni=allLeads.length-prevLeadCount;
        triggerNewLeadNotification(yeni);
      }
      prevLeadCount=allLeads.length;
      updateStats();renderLeads();
      document.getElementById('lastRefreshTxt').textContent=`Son: ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`;
      if(!refreshInterval)refreshInterval=setInterval(()=>loadLeads(false),20000);
    }
  }catch(e){console.error('❌ Load error:',e);showToast('Bağlantı hatası','error');}
  finally{document.getElementById('loading').style.display='none';document.getElementById('refreshBtn').classList.remove('spinning');}
}

function triggerNewLeadNotification(count){
  unreadCount+=count;
  const badge=document.getElementById('bellBadge');
  const bell=document.getElementById('bellBtn');
  badge.textContent=unreadCount;
  badge.classList.add('show');
  bell.classList.add('has-new');
  document.getElementById('nlaTitle').textContent=count===1?'Yeni Lead Geldi!':count+' Yeni Lead Geldi!';
  document.getElementById('nlaSub').textContent=count===1?'Bir potansiyel müşteri bilgilerini bıraktı.':count+' potansiyel müşteri bilgilerini bıraktı.';
  const alert=document.getElementById('newLeadAlert');
  alert.classList.add('show');
  playBellSound();
  if(Notification&&Notification.permission==='granted'){
    new Notification('Turyap Queen — Yeni Lead!',{body:count+' yeni potansiyel müşteri bilgilerini bıraktı.',icon:'icon.svg'});
  }else if(Notification&&Notification.permission!=='denied'){
    Notification.requestPermission();
  }
}

function playBellSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o1=ctx.createOscillator(),g1=ctx.createGain();
    o1.connect(g1);g1.connect(ctx.destination);
    o1.frequency.setValueAtTime(880,ctx.currentTime);
    o1.frequency.exponentialRampToValueAtTime(660,ctx.currentTime+0.2);
    g1.gain.setValueAtTime(0.4,ctx.currentTime);
    g1.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    o1.start(ctx.currentTime);o1.stop(ctx.currentTime+0.4);
    const o2=ctx.createOscillator(),g2=ctx.createGain();
    o2.connect(g2);g2.connect(ctx.destination);
    o2.frequency.setValueAtTime(1100,ctx.currentTime+0.25);
    o2.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.45);
    g2.gain.setValueAtTime(0.3,ctx.currentTime+0.25);
    g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);
    o2.start(ctx.currentTime+0.25);o2.stop(ctx.currentTime+0.6);
  }catch(e){}
}

function dismissAlert(){document.getElementById('newLeadAlert').classList.remove('show');}
function clearBell(){
  unreadCount=0;
  document.getElementById('bellBadge').classList.remove('show');
  document.getElementById('bellBtn').classList.remove('has-new');
  dismissAlert();
}

function updateStats(){
  const today=new Date().toDateString();
  const tot=allLeads.length;
  const toDay=allLeads.filter(l=>new Date(l.createdAt).toDateString()===today).length;
  const nw=allLeads.filter(l=>l.status==='yeni'||l.status==='aranacak').length;
  const done=allLeads.filter(l=>l.status==='kapali').length;
  document.getElementById('sTot').textContent=tot;
  document.getElementById('sToday').textContent=toDay;
  document.getElementById('sNew').textContent=nw;
  document.getElementById('sDone').textContent=done;
  const counts={all:tot};
  ['yeni','aranacak','takip','kapali'].forEach(s=>{counts[s]=allLeads.filter(l=>l.status===s).length;});
  document.getElementById('cAll').textContent=counts.all;
  document.getElementById('cYeni').textContent=counts.yeni;
  document.getElementById('cAranacak').textContent=counts.aranacak;
  document.getElementById('cTakip').textContent=counts.takip;
  document.getElementById('cKapali').textContent=counts.kapali;
  updateAnalytics();
}

function updateAnalytics(){
  const total=allLeads.length||1;
  const topicOrder=['satis','kiralama','yatirim','degerleme','genel'];
  const topicCounts={};
  topicOrder.forEach(k=>{topicCounts[k]=allLeads.filter(l=>(l.topic||'genel')===k).length;});
  document.getElementById('topicBars').innerHTML=topicOrder.filter(k=>topicCounts[k]>0).map(k=>{
    const m=topicMeta[k];const pct=Math.round(topicCounts[k]/total*100);
    return`<div class="topic-bar-item"><div class="topic-bar-label"><span>${m.label}</span><span>${topicCounts[k]}</span></div><div class="topic-bar-track"><div class="topic-bar-fill ${m.barCls}" style="width:${pct}%"></div></div></div>`;
  }).join('')||'<div style="font-size:11px;color:var(--dimtxt)">Veri bekleniyor…</div>';
  const langCount={};
  allLeads.forEach(l=>{const lg=l.lang||'tr';langCount[lg]=(langCount[lg]||0)+1;});
  document.getElementById('langDist').innerHTML=Object.entries(langCount).sort((a,b)=>b[1]-a[1]).map(([lg,cnt])=>`<div class="lang-dist-item">${langFlags[lg]||'🌐'}<span class="ldi-count">${cnt}</span></div>`).join('')||'<span style="font-size:11px;color:var(--dimtxt)">—</span>';
  const days=[];const now=new Date();
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);days.push(d);}
  const dayCounts=days.map(d=>allLeads.filter(l=>new Date(l.createdAt).toDateString()===d.toDateString()).length);
  const maxCount=Math.max(...dayCounts,1);
  document.getElementById('trendChart').innerHTML=days.map((d,i)=>{
    const cnt=dayCounts[i];const h=Math.round((cnt/maxCount)*44)+2;const isToday=i===6;
    return`<div class="trend-bar-wrap"><div class="trend-bar-num">${cnt||''}</div><div class="trend-bar-fill${isToday?' today':''}" style="height:${h}px"></div><div class="trend-bar-day">${DAY_NAMES[d.getDay()]}</div></div>`;
  }).join('');
}

function setFilter(f,el){currentFilter=f;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');renderLeads();}

function getFilteredLeads(){
  const query=document.getElementById('searchInput').value.toLowerCase().trim();
  const fromVal=document.getElementById('dateFrom').value;
  const toVal=document.getElementById('dateTo').value;
  let filtered=allLeads;
  if(currentFilter!=='all')filtered=filtered.filter(l=>l.status===currentFilter);
  if(query)filtered=filtered.filter(l=>(l.name||'').toLowerCase().includes(query)||(l.phone||'').replace(/\s/g,'').includes(query.replace(/\s/g,'')));
  if(fromVal){const f=new Date(fromVal);f.setHours(0,0,0,0);filtered=filtered.filter(l=>new Date(l.createdAt)>=f);}
  if(toVal){const t=new Date(toVal);t.setHours(23,59,59,999);filtered=filtered.filter(l=>new Date(l.createdAt)<=t);}
  return filtered;
}

function renderLeads(){
  const filtered=getFilteredLeads();
  const grid=document.getElementById('leadGrid');
  if(filtered.length===0){grid.innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><p>Lead bulunamadı</p></div>`;return;}
  grid.innerHTML=filtered.map(lead=>buildCard(lead)).join('');
}

const topicLabels={satis:'Satış',kiralama:'Kiralama',yatirim:'Yatırım',degerleme:'Değerleme',genel:'Genel'};
const statusLabels={yeni:'Yeni',aranacak:'Aranacak',takip:'Takipte',kapali:'Kapandı'};

function leadsToRows(leads){
  const rows=[['Tarih','Ad Soyad','Telefon','Konu','Durum','Dil']];
  leads.forEach(l=>{
    const d=l.createdAt?new Date(l.createdAt).toLocaleString('tr-TR'):'';
    rows.push([d,l.name||'',l.phone||'',topicLabels[l.topic]||l.topic||'',statusLabels[l.status]||l.status||'',l.lang||'']);
  });
  return rows;
}

function exportCSV(){
  if(exportInProgress)return;
  exportInProgress=true;
  const btn=document.getElementById('csvBtn');
  btn.disabled=true;
  try{
    const rows=leadsToRows(getFilteredLeads());
    const bom='﻿';
    const csv=bom+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='turyapqueen-leads-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV indirildi ✓','success');
  }finally{
    btn.disabled=false;
    exportInProgress=false;
  }
}

function exportExcel(){
  if(exportInProgress)return;
  exportInProgress=true;
  const btn=document.getElementById('excelBtn');
  btn.disabled=true;
  try{
    const rows=leadsToRows(getFilteredLeads());
    const xml=['<?xml version="1.0" encoding="UTF-8"?>',
      '<?mso-application progid="Excel.Sheet"?>',
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">',
      '<Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles>',
      '<Worksheet ss:Name="Leads"><Table>'];
    rows.forEach((r,i)=>{
      xml.push('<Row>');
      r.forEach(c=>{xml.push(`<Cell${i===0?' ss:StyleID="h"':''}><Data ss:Type="String">${String(c).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</Data></Cell>`);});
      xml.push('</Row>');
    });
    xml.push('</Table></Worksheet></Workbook>');
    const blob=new Blob([xml.join('')],{type:'application/vnd.ms-excel;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='turyapqueen-leads-'+new Date().toISOString().slice(0,10)+'.xls';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Excel indirildi ✓','success');
  }finally{
    btn.disabled=false;
    exportInProgress=false;
  }
}

function buildCard(lead){
  const topic=topicMeta[lead.topic]||topicMeta.genel;
  const status=statusMeta[lead.status]||statusMeta.yeni;
  const flag=langFlags[lead.lang]||'🌐';
  const timeAgo=relTime(lead.createdAt);
  const phone=lead.phone||'';
  const name=lead.name||'İsimsiz';
  const safeId=(lead.id||'').replace(/[^a-zA-Z0-9_]/g,'_');
  const ctxHtml=buildContext(lead);
  const isNew=(Date.now()-new Date(lead.createdAt).getTime())<300000;
  const statusOptions=Object.entries(statusMeta).map(([k,v])=>`<option value="${k}" ${lead.status===k?'selected':''}>${v.label}</option>`).join('');
  return`<div class="lead-card${isNew?' is-new':''}" id="card_${safeId}">
    <div class="card-top">
      <div class="card-header">
        <div class="card-header-left"><div class="card-name">${escHtml(name)}</div><div class="card-time">${timeAgo}${isNew?' 🟢':''}</div></div>
        <div class="card-header-right">
          <div class="card-lang">${flag}</div>
          <button class="delete-btn" onclick="deleteLead('${lead.id}','${safeId}')" title="Sil">🗑️</button>
        </div>
      </div>
      ${phone?`<div class="card-phone">
        <span class="card-phone-num">${escHtml(phone)}</span>
        <button class="copy-btn" onclick="copyPhone('${escHtml(phone)}')" title="Kopyala"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>`:'<div class="card-phone"><span class="card-phone-num" style="color:var(--dimtxt);">Telefon yok</span></div>'}
      <div class="card-badges">
        <span class="topic-badge ${topic.cls}">${topic.label}</span>
        <span class="status-badge ${status.cls}" id="sbadge_${safeId}">${status.label}</span>
      </div>
    </div>
    ${ctxHtml?`<div class="card-context" id="ctx_${safeId}">${ctxHtml}</div>`:''}
    <div class="card-actions">
      <div class="action-btns">
        ${phone?`<a href="tel:${encodeURIComponent(phone)}" class="act-btn call">📞 Ara</a><a href="https://wa.me/${phone.replace(/[^0-9]/g,'')}" target="_blank" class="act-btn wa">💬 WA</a>`:''}
        ${ctxHtml?`<button class="act-btn expand" onclick="toggleCtx('${safeId}')">💬</button>`:''}
      </div>
      <select class="status-select" onchange="updateStatus('${lead.id}',this.value,'${safeId}')">${statusOptions}</select>
    </div>
  </div>`;
}

function buildContext(lead){
  if(!lead)return '';
  let html='';
  
  // Context messages varsa göster (conversation history)
  if(lead.context && Array.isArray(lead.context) && lead.context.length>0){
    const msgs=lead.context.slice(0,6);
    const rows=msgs.map(m=>`<div class="context-msg"><span class="ctx-role ${m.role==='user'?'user':'bot'}">${m.role==='user'?'👤':'🤖'}</span><span class="ctx-text">${escHtml((m.text||'').substring(0,200))}${(m.text||'').length>200?'…':''}</span></div>`).join('');
    html+=`<div class="context-title">💬 Konuşma</div>${rows}`;
  }
  
  // Analysis result varsa ekle
  if(lead.analysis_result){
    html+=`<div class="context-title" style="margin-top:10px;color:#059669;">📊 Analiz Sonucu</div><div class="ctx-text" style="color:#047857;line-height:1.6;">${escHtml((lead.analysis_result||'').substring(0,400))}${(lead.analysis_result||'').length>400?'…':''}</div>`;
  }
  
  // Analysis field varsa (alternatif field name)
  if(lead.analysis && !lead.analysis_result){
    html+=`<div class="context-title" style="margin-top:10px;color:#059669;">📊 Analiz</div><div class="ctx-text" style="color:#047857;line-height:1.6;">${escHtml((lead.analysis||'').substring(0,400))}${(lead.analysis||'').length>400?'…':''}</div>`;
  }
  
  return html;
}

function toggleCtx(safeId){
  const el=document.getElementById(`ctx_${safeId}`);
  if(el)el.classList.toggle('open');
}

async function updateStatus(id,newStatus,safeId){
  try{
    const res=await fetch(`${WORKER_URL}/lead-status`,{method:'POST',headers:{'Content-Type':'application/json','x-leads-secret':secret},body:JSON.stringify({id,status:newStatus})});
    const data=await res.json();
    if(data.ok){
      const lead=allLeads.find(l=>l.id===id);
      if(lead){
        lead.status=newStatus;
        updateStats();
        const badge=document.getElementById(`sbadge_${safeId}`);
        if(badge){
          const sm=statusMeta[newStatus]||statusMeta.yeni;
          badge.className=`status-badge ${sm.cls}`;
          badge.textContent=sm.label;
        }
        showToast('Durum güncellendi ✓','success');
      }
    }
  }catch(e){
    showToast('Güncelleme başarısız','error');
  }
}

async function deleteLead(id,safeId){
  if(!confirm('Bu lead\'i silmek istediğinizden emin misiniz?'))return;
  try{
    const res=await fetch(`${WORKER_URL}/lead-delete`,{method:'POST',headers:{'Content-Type':'application/json','x-leads-secret':secret},body:JSON.stringify({id})});
    const data=await res.json();
    if(data.ok){
      allLeads=allLeads.filter(l=>l.id!==id);
      const card=document.getElementById(`card_${safeId}`);
      if(card){
        card.style.animation='cardOut 0.3s ease forwards';
        setTimeout(()=>{card.remove();renderLeads();updateStats();},300);
      }
      showToast('Lead silindi ✓','success');
    }else{
      showToast('Silme başarısız','error');
    }
  }catch(e){
    allLeads=allLeads.filter(l=>l.id!==id);
    const card=document.getElementById(`card_${safeId}`);
    if(card){
      card.style.animation='cardOut 0.3s ease forwards';
      setTimeout(()=>{card.remove();renderLeads();updateStats();},300);
    }
    showToast('Lead silindi (yerel) ✓','success');
  }
}

function copyPhone(phone){
  navigator.clipboard.writeText(phone).then(()=>showToast('Kopyalandı ✓','success'));
}

function relTime(iso){
  if(!iso)return'';
  const diff=Date.now()-new Date(iso).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1)return'Az önce';
  if(mins<60)return`${mins} dk önce`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return`${hrs} saat önce`;
  const days=Math.floor(hrs/24);
  if(days<7)return`${days} gün önce`;
  return new Date(iso).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=`toast ${type}`;
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>t.classList.remove('show'),2800);
}

document.getElementById('secretInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('loginBtn').addEventListener('click',doLogin);
</script>
