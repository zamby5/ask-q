<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Dashboard — Ask·Q</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #0d2247 0%, #1a3a7a 100%);
      color: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(13, 34, 71, 0.15);
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      font-family: 'Playfair Display', serif;
    }
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0d2247;
      color: white;
    }
    .btn-primary:hover {
      background: #1a3a7a;
    }
    .btn-secondary {
      background: white;
      color: #0d2247;
      border: 1.5px solid #e2e8f0;
    }
    .btn-secondary:hover {
      background: #f7f8fa;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-label {
      font-size: 12px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #0d2247;
    }
    .leads-table {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #f7f8fa;
      padding: 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e2e8f0;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    tbody tr:hover {
      background: #f7f8fa;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-buyer {
      background: #dbeafe;
      color: #1e40af;
    }
    .badge-seller {
      background: #fce7f3;
      color: #be185d;
    }
    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #0d2247;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #a0aec0;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📊 Lead Dashboard</h1>
    <p>Ask·Q chatbot'tan gelen müşteri verilerini yönetin</p>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="loadLeads()">🔄 Yenile</button>
    <button class="btn btn-secondary" onclick="exportCSV()">📥 CSV İndir</button>
    <input type="text" id="searchInput" placeholder="Ad, telefon veya not ara..." 
      style="flex:1; min-width:200px; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:13px;"
      onkeyup="filterLeads()">
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Toplam Lead</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Alıcı</div>
      <div class="stat-value" id="buyerCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Satıcı</div>
      <div class="stat-value" id="sellerCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Son 24 Saat</div>
      <div class="stat-value" id="todayCount">0</div>
    </div>
  </div>

  <div class="leads-table">
    <div id="loadingIndicator" class="loading" style="display:none;">
      <div class="spinner"></div>
      <p style="margin-top:12px;">Veriler yükleniyor...</p>
    </div>
    <div id="emptyState" class="empty" style="display:none;">
      <div class="empty-icon">📭</div>
      <p>Henüz lead kaydı yok</p>
    </div>
    <table id="leadsTable" style="display:none;">
      <thead>
        <tr>
          <th>İsim</th>
          <th>Telefon</th>
          <th>Tür</th>
          <th>Tarih</th>
          <th>Not</th>
        </tr>
      </thead>
      <tbody id="leadsBody"></tbody>
    </table>
  </div>
</div>

<script>
const LEAD_WORKER = 'https://ask-q-leads.miyicioglu.workers.dev'; // ← Güncelle
let allLeads = [];

async function loadLeads() {
  const loading = document.getElementById('loadingIndicator');
  const table = document.getElementById('leadsTable');
  const empty = document.getElementById('emptyState');
  const tbody = document.getElementById('leadsBody');
  
  loading.style.display = 'block';
  table.style.display = 'none';
  empty.style.display = 'none';
  tbody.innerHTML = '';
  
  try {
    // Cloudflare KV namespace'ten oku
    // Not: Direct KV erişimi yok — worker aracılığıyla
    // Alternatif: Worker'a GET /leads endpoint'i ekle (liste dönsün)
    
    // Şimdilik: localStorage'dan demo veri
    const stored = localStorage.getItem('askq-leads');
    const leads = stored ? JSON.parse(stored) : [];
    
    if (leads.length === 0) {
      loading.style.display = 'none';
      empty.style.display = 'block';
      updateStats(leads);
      return;
    }
    
    allLeads = leads;
    renderLeads(leads);
    updateStats(leads);
    
    loading.style.display = 'none';
    table.style.display = 'table';
    
  } catch (e) {
    console.error('Lead yükleme hatası:', e);
    loading.style.display = 'none';
    empty.style.display = 'block';
    empty.innerHTML = '<div class="empty-icon">⚠️</div><p>Veriler yüklenemedi</p>';
  }
}

function renderLeads(leads) {
  const tbody = document.getElementById('leadsBody');
  tbody.innerHTML = leads.map((lead, idx) => `
    <tr>
      <td><strong>${escapeHtml(lead.name || '—')}</strong></td>
      <td><a href="tel:${lead.phone}" style="color:#0d2247; text-decoration:none;">${escapeHtml(lead.phone || '—')}</a></td>
      <td>
        <span class="badge ${lead.type === 'Buyer' ? 'badge-buyer' : 'badge-seller'}">
          ${lead.type === 'Buyer' ? '🛒 Alıcı' : '🏠 Satıcı'}
        </span>
      </td>
      <td>${new Date(lead.timestamp).toLocaleDateString('tr-TR')}</td>
      <td style="max-width:200px; color:#718096; font-size:12px;">${escapeHtml((lead.note || '—').substring(0, 50))}</td>
    </tr>
  `).join('');
}

function filterLeads() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allLeads.filter(l => 
    (l.name || '').toLowerCase().includes(q) ||
    (l.phone || '').includes(q) ||
    (l.note || '').toLowerCase().includes(q)
  );
  renderLeads(filtered);
}

function updateStats(leads) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  
  document.getElementById('totalCount').textContent = leads.length;
  document.getElementById('buyerCount').textContent = leads.filter(l => l.type === 'Buyer').length;
  document.getElementById('sellerCount').textContent = leads.filter(l => l.type === 'Seller').length;
  document.getElementById('todayCount').textContent = leads.filter(l => 
    new Date(l.timestamp) >= today
  ).length;
}

function exportCSV() {
  if (allLeads.length === 0) {
    alert('Export edilecek veri yok');
    return;
  }
  
  const headers = ['İsim', 'Telefon', 'Tür', 'Tarih', 'Not'];
  const rows = allLeads.map(l => [
    l.name || '',
    l.phone || '',
    l.type || '',
    new Date(l.timestamp).toLocaleDateString('tr-TR'),
    l.note || ''
  ]);
  
  const csv = [
    headers.join(','),
    ...rows.map(r => r.map(v => `"${v}"`).join(','))
  ].join('\n');
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'ask-q-leads-' + new Date().toISOString().split('T')[0] + '.csv';
  link.click();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Sayfa yüklenince yükle
window.addEventListener('load', loadLeads);

// Her 30 saniyede yenile
setInterval(loadLeads, 30000);
</script>

</body>
</html>
